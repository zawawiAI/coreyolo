# Shorter COCO pass for CoreYOLO-n — sanity-check mAP before the 300-epoch run.

data: datasets/coco/data.yaml
model: n
epochs: 100
batch: 16
imgsz: 640
device: gpu
workers: 4
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
act: relu
family: gelan
box: 7.5
cls: 0.5
dfl: 1.5
mosaic: 1.0
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
patience: 50
val_period: 5
seed: 0
project: runs/detect
name: coco-n-fast
