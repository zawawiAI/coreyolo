# Alias of coco-n-e2e. Prefer: coreyolo train --recipe coco-n-e2e
# Kept so --recipe coco-n-26 still works.

data: datasets/coco/data.yaml
model: n
family: e2e
epochs: 300
batch: 16
imgsz: 640
device: gpu
workers: 4
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
act: relu
box: 7.5
cls: 0.5
dfl: 0.0
mosaic: 1.0
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
patience: 100
val_period: 5
seed: 0
project: runs/detect
name: coco-n-e2e
