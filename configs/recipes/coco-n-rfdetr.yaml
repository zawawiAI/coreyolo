# COCO 2017 — CoreYOLO RF-DETR n.
# Square size must be divisible by patch 16 × 2 windows (32). Native size is 384.
# Learning rate stays at 1e-4. The trainer also caps a YOLO-style 0.01 default.
#
#   coreyolo coco --out datasets/coco --download
#   coreyolo train --recipe coco-n-rfdetr

data: datasets/coco/data.yaml
model: n
epochs: 100
batch: 8
imgsz: 384
device: gpu
workers: 4
lr0: 0.0001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0001
warmup_epochs: 1.0
act: gelu
family: rfdetr
box: 5.0
cls: 1.0
dfl: 0.0
mosaic: 0.0
close_mosaic: 0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
patience: 30
val_period: 5
seed: 0
project: runs/detect
name: coco-n-rfdetr
